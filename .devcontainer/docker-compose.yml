services:
    mongodb:
        image: mongo:7
        restart: unless-stopped
        ports:
            - '27017:27017'
        volumes:
            - mongodb-data:/data/db
        environment:
            MONGO_INITDB_DATABASE: products
        healthcheck:
            test: ['CMD', 'mongosh', '--eval', 'db.adminCommand("ping")']
            interval: 5s
            timeout: 5s
            retries: 5

    postgres:
        image: postgres:17
        restart: unless-stopped
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U postgres']
            interval: 1s
            timeout: 5s
            retries: 10
        env_file: devcontainer.env
        ports:
            - '5432:5432'
        volumes:
            - postgres-data:/var/lib/postgresql/data

    app:
        build:
            context: .
            dockerfile: Dockerfile
        ports:
            - '8000:8000'
            - '5173:5173'
        volumes:
            - ..:/workspace
            - ${HOME}/.ssh:/home/vscode/.ssh:ro
            - ${HOME}/.config/git:/home/vscode/.config/git:ro
        env_file: devcontainer.env
        depends_on:
            mongodb:
                condition: service_healthy
            postgres:
                condition: service_healthy
        command: sleep infinity

volumes:
    mongodb-data:
    postgres-data:

